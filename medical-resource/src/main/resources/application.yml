server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/medical_resource?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  autoconfigure:
    # 本服务不用 Spring Security 过滤器链，鉴权由自定义 config/JwtFilter 完成
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入；下面的默认值仅供本地开发，切勿用于线上
    secret: ${JWT_SECRET:ganpo-medical-dev-only-jwt-secret-do-not-use-in-production-0123456789}
    expire-seconds: 3600
