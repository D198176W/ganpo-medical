server.port=8080
spring.application.name=java-ai-langchain4j


langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen3.6-max-preview

langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen3.7-max-preview

langchain4j.community.dashscope.embedding-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3


spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}

# Redis（Unified Cache）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000

# Unified Cache 配置
app.cache.chat-answer-ttl-seconds=1800
app.cache.enabled=true

# 多模型路由：轻量模型（成本分级 + 主模型故障降级）
app.model.lite-model-name=qwen-plus

# 风控审核 Agent（红队复核）
app.review.enabled=true
app.review.min-answer-length=80

# 敏感信息加密密钥（32 位，生产环境必须通过环境变量注入）
app.encrypt.key=${ENCRYPT_KEY:ganpo-medical-2026-secret-key!!}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
logging.level.root=info
langchain4j.community.dashscope.chat-model.sanitize-messages=true



