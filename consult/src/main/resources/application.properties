server.port=8080
spring.application.name=consult
langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.chat-model.model-name=qwen3-max
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen3-max
langchain4j.community.dashscope.embedding-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
logging.level.root=info
langchain4j.community.dashscope.chat-model.sanitize-messages=true



