server:
  port: 8082

spring:
  application:
    name: pathology
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/pathology?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入；下面的默认值仅供本地开发，切勿用于线上
    secret: ${JWT_SECRET:ganpo-medical-dev-only-jwt-secret-do-not-use-in-production-0123456789}
    expireSeconds: 86400
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
