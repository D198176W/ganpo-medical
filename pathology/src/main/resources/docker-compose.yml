version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: pathology_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: pathology
      MYSQL_USER: pathology
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pathologypwd}
    ports:
      # 宿主端口使用 3307，与本项目其它环境的数据库端口保持一致
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2
    container_name: pathology_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data: