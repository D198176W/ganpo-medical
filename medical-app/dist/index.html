<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>南昌智能医疗服务平台</title>
    <meta name="description" content="南昌本地智能医疗服务平台，提供智能问诊、健康管理、病理分析等服务" />
    <meta name="keywords" content="医疗,健康,南昌,智能问诊,健康管理" />
    
    <!-- 移动端优化 -->
    <meta name="apple-web-app-capable" content="yes" />
    <meta name="apple-web-app-status-bar-style" content="black-translucent" />
    
    <!-- 预加载关键资源 -->
    
    

    <!-- 引入全局样式 -->
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="app"></div>
    
    
    <!-- 加载状态指示器 -->
    <div id="loading-indicator">
      <div class="loading-spinner"></div>
      <h2>南昌智能医疗服务平台</h2>
      <p>正在加载，请稍候...</p>
    </div>
    
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('loading-indicator');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });

      window.addEventListener('error', function() {
        const loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.innerHTML = `
            <h2>加载失败</h2>
            <p>抱歉，应用加载遇到问题，请刷新页面重试</p>
            <button onclick="location.reload()" style="
              margin-top: 20px;
              padding: 10px 20px;
              background: white;
              color: #1E88E5;
              border: none;
              border-radius: 5px;
              cursor: pointer;
              font-weight: bold;
            ">刷新页面</button>
          `;
        }
      });
    </script>
  </body>
</html>
