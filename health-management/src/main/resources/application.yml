# 健康管理服务配置
server:
  port: 8081
  servlet:
    context-path: /health
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: health-management
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/health_management?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 文件上传与静态资源配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:./uploads/
  mvc:
    static-path-pattern: /static/**

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: always
      update-strategy: always
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ganpo.healthmanagement.entity

jwt:
  # 注意：JwtConfig 会对该值做 Base64 解码，因此必须是合法 Base64 字符串
  # 生产环境必须通过环境变量 JWT_SECRET 注入；下面的默认值仅供本地开发，切勿用于线上
  secret: ${JWT_SECRET:Z2FucG8tbWVkaWNhbC1kZXYtb25seS1qd3Qtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5}
  expiration: 86400000
  header: "Authorization"
  prefix: "Bearer"

security:
  ignored:
    - /api/auth/**
    - /api/hospitals
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /doc.html
    - /favicon.ico

# 日志配置
logging:
  level:
    com.ganpo.healthmanagement: DEBUG
    com.baomidou.mybatisplus: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
  file:
    name: logs/health-management.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 健康指标目标值
health:
  management:
    # 运动目标
    exercise:
      target-days-per-week: 3
      target-duration-per-week: 150  # 分钟
    # 睡眠目标
    sleep:
      target-hours-per-day: 7
      early-sleep-time: "22:00"   # 建议入睡时间
      late-sleep-time: "23:30"    # 最晚入睡时间
    # 提醒
    reminder:
      enabled: true
      check-interval: 300000  # 5 分钟检查一次

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

# ---------------------------------------------------------------------------
# 已移除的无效配置（对应依赖并不存在，属于误导性配置）：
#   - spring.jpa.*           本模块未引入 JPA 依赖，ddl-auto 不会建表
#   - spring.data.redis.*    本模块未引入 Redis 依赖
#   - mail.*                 本模块未引入 spring-boot-starter-mail
#   - swagger.*              本模块未引入 knife4j / springdoc 依赖
#   - debug: true            与 logging.level 配置重复，且会输出大量自动配置报告
# ---------------------------------------------------------------------------
