# MyBatis Plus??
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: always
      update-strategy: always
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.atguigu.healthmanagement.entity

jwt:
  secret: ""
  expiration: 86400000
  header: "Authorization"
  prefix: "Bearer"

security:
  ignored:
    - /api/auth/**
    - /api/hospitals
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /doc.html
    - /favicon.ico




# ????
logging:
  level:
    com.atguigu.healthmanagement: DEBUG
    com.baomidou.mybatisplus: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  file:
    name: logs/health-management.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger???API???
swagger:
  enabled: true
  title: ??????API??
  description: ???????????????????
  version: 1.0.0
  base-package: com.atguigu.healthmanagement.controller

# 健康管理配置
health:
  management:
    # 运动目标配置
    exercise:
      target-days-per-week: 3
      target-duration-per-week: 150  # 分钟
    # 睡眠目标配置
    sleep:
      target-hours-per-day: 7
      early-sleep-time: "22:00"  # 早睡时间
      late-sleep-time: "23:30"   # 晚睡时间
    # 提醒配置
    reminder:
      enabled: true
      check-interval: 300000  # 5分钟检查一次

# 邮件配置
mail:
  host: smtp.163.com
  port: 465
  username: health-management@163.com
  password: your-email-password
  protocol: smtps
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        ssl:
          enable: true

# 监控管理配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

debug: true